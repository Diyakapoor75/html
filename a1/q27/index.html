<!DOCTYPE html>
<html>

<head>
    <title> navbar </title>
</head>

<body>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        .container {
            background-color: hsl(142.39deg 77.17% 36.08%);
            color: white;
            display: flex;
            padding: 10px;
            padding-left: 20px;
            gap: 24px;

        }

        .container p {
            font-size: small;
        }

        .container2 {
            box-shadow: 1px 0px 15px 0px #b5aeae;
            padding: 15px;
            display: flex;
            justify-content: space-between;
        }

        .container2 h1 {
            font-size: large;
            margin-bottom: 3px;

        }

        .container2 p {
            font-size: small;
            color: #b7b2b2;
        }

        .container2 img {
            margin-right: 7px;
            margin-top: 3px;
        }

        .logo {
            display: flex;
        }

        .links a {
            color: rgb(11, 11, 11);
            text-decoration: none;
        }

        .links {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        button {
            border: 1.7px solid #578cf0;
            background: transparent;
            padding-left: 15px;
            padding-right: 15px;
            border-radius: 200px;
            font-weight: bolder;
            color: #578cf0;
            padding-top: 10px;
            padding-bottom: 10px;
        }
    </style>
    <div class="container">
        <p>Pune, India</p>
        <p>info@company.com</p>
    </div>
    <div class="container2">
        <div class="logo">

            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRyD_EnKpJPoZ0X8UnIbQJtJdTmLUswitwhs-4wH7yehDAdNDUZyysLVEc&s"
                alt="location" height="30px">

            <div>
                <h1>Charity</h1>
                <p>Non-profit Organisation</p>
            </div>
        </div>
        <div class="links">
            <a href="home">Home</a>
            <a href="about">About</a>
            <a href="causes">Causes</a>
            <a href="volunteer">Volunteer</a>
            <a href="news">News</a>
            <a href="contact">Contact</a>
            <button>Donate</button>

        </div>
    </div>
</body>

</html>
